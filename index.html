<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    #bg-video {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      transform: translate(-50%, -50%);
      object-fit: contain; /* Prevents zooming, fits full video frame */
      z-index: 1;
    }
  </style>
</head>
<body>

  <video autoplay loop muted playsinline id="bg-video">
    <source src="20260911-0145-53.2090122.mp4" type="video/mp4">
  </video>

</body>
</html>
