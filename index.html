<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    /* Responsive Fullscreen Video Container */
    .vimeo-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .vimeo-wrapper iframe {
      width: 100vw;
      height: 56.25vw; /* 16:9 Aspect Ratio */
      min-height: 100vh;
      min-width: 177.77vh; /* 16:9 Aspect Ratio */
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>

  <div class="vimeo-wrapper">
    <iframe 
      src="https://player.vimeo.com/video/1225807278?background=1&autoplay=1&loop=1&byline=0&title=0&muted=1" 
      frameborder="0" 
      allow="autoplay; fullscreen" 
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
